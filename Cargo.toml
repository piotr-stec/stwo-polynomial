[package]
name = "stwo-polynomial"
version = "0.1.0"
edition = "2021"
description = "A cryptographic library providing prove and verify functionality"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/stwo-polynomial"
authors = ["Your Name <you@example.com>"]

[lib]
name = "stwo_polynomial"
path = "src/lib.rs"

[[example]]
name = "prove_fibonacci"
path = "examples/prove_fibonacci/prove.rs"

[[example]]
name = "verify_fibonacci"
path = "examples/verify_fibonacci/verify.rs"

[dependencies]
stwo = { git = "https://github.com/starkware-libs/stwo", features = ["prover"], tag = "v1.0.0" }
stwo-std-shims = { git = "https://github.com/starkware-libs/stwo", features = ["std"],tag = "v1.0.0" }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", features = ["prover", "std"], tag = "v1.0.0" }
num-traits = "0.2"
thiserror = { version = "2.0.12", default-features = false }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"