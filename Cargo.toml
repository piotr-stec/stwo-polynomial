[package]
name = "stwo-polynomial"
version = "0.1.0"
edition = "2021"
description = "A cryptographic library providing prove and verify functionality"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/stwo-polynomial"
authors = ["Your Name <you@example.com>"]

[lib]
name = "stwo_polynomial"
path = "src/lib.rs"

[[example]]
name = "prove_fibonacci"
path = "examples/prove_fibonacci/prove.rs"

[[example]]
name = "verify_fibonacci"
path = "examples/verify_fibonacci/verify.rs"

[[example]]
name = "privacy_pools"
path = "examples/privacy_pools/main.rs"

[[example]]
name = "fibonacci_onchain"
path = "examples/fibonacci_onchain/main.rs"

[dependencies]
stwo-prover = { git = "https://github.com/piotr-stec/stwo-fork-keccak", branch = "feat/gnark" }

num-traits = "0.2"
thiserror = { version = "1.0.56" }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alloy = { version = "1.1.3", features = ["full", "node-bindings"] }
alloy-primitives = "1.1.3"
alloy-sol-types = "1.1.3"
alloy-contract = "1.1.3"
alloy-provider = "1.1.3"
alloy-network = "1.1.3"
alloy-signer = "1.1.3"
alloy-signer-local = "1.1.3"
tokio = { version = "1.0", features = ["full"] }